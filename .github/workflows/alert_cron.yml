name: ApexRadar — Real-Time B2B Contract Intelligence & Social Dispatcher

on:
  schedule:
    # Runs every 30 minutes (consumes ~150 mins/mo of 2,000 free minutes)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from mobile GitHub app/browser

jobs:
  poll-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install

      - name: Restore SQLite Deduplication Cache
        uses: actions/cache@v4
        with:
          path: data/
          key: deduplication-db-${{ github.run_id }}
          restore-keys: |
            deduplication-db-

      - name: Execute Lead Ingestion & Alert Dispatch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MIN_BUDGET_USD: ${{ secrets.MIN_BUDGET_USD || '2000' }}
          MIN_HOURLY_USD: ${{ secrets.MIN_HOURLY_USD || '50' }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_COOLDOWN_HOURS: ${{ secrets.LINKEDIN_COOLDOWN_HOURS || '4.0' }}
          X_WEBHOOK_URL: ${{ secrets.X_WEBHOOK_URL }}
          X_AUTO_PUBLISH: ${{ secrets.X_AUTO_PUBLISH || 'true' }}
          X_COOLDOWN_HOURS: ${{ secrets.X_COOLDOWN_HOURS || '2.0' }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          DATA_DIR: './data'
        run: |
          mkdir -p data
          python -m b2b_alert_bot.main --cron

      - name: Save Deduplication Cache
        uses: actions/cache@v4
        if: always()
        with:
          path: data/
          key: deduplication-db-${{ github.run_id }}
